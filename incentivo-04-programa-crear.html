<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Naowee Incentivos — Parametrizar programa</title>

<!-- SDK Naowee · sdk-frontend-foundations (compilado en shared/sdk) -->
<link rel="stylesheet" href="shared/sdk/inter.css"/>
<link rel="stylesheet" href="shared/sdk/styles.css"/>
<link rel="stylesheet" href="shared/sdk/components.css"/>
<link rel="stylesheet" href="shared/sdk/icons.css"/>
<!-- Solo layout de esta pantalla; todo componente/token viene del SDK -->
<link rel="stylesheet" href="shared/programa-form.css?v=3"/>
</head>
<body>

<div class="pf">

  <header class="nwt-toolbar pf-toolbar">
    <div class="nwt-toolbar__content">
      <div class="nwt-toolbar__body pf-toolbar__body">
        <nav class="nwt-breadcrumb" aria-label="breadcrumb">
          <ol class="nwt-breadcrumb__list">
            <li class="nwt-breadcrumb__item"><a class="nwt-breadcrumb__link" href="incentivo-03-programas.html">Programas</a></li>
            <li class="nwt-breadcrumb__item"><span class="nwt-breadcrumb__text nwt-breadcrumb__text--active" id="pfCrumb">Nuevo programa</span></li>
          </ol>
        </nav>
        <div class="pf-toolbar__title">
          <h1 class="pf-title" id="pfTitle">Parametrizar programa de incentivos</h1>
          <span id="pfStateBadge"></span>
        </div>
      </div>
      <div class="nwt-toolbar__actions">
        <a class="nwt-button" nwt-variant="mute" nwt-size="medium" href="incentivo-03-programas.html"><span class="nwt-button__content">Cancelar</span></a>
        <button class="nwt-button" nwt-variant="quiet" nwt-size="medium" type="button" data-act="save-draft"><span class="nwt-button__content"><div class="nwt-icon nwt-button__icon"><i class="naotech-icon-bookmark"></i></div>Guardar borrador</span></button>
      </div>
    </div>
  </header>

  <div class="pf-stepper-band"><div class="nwt-stepper" id="pfStepper"></div></div>

  <main class="pf-main" id="pfMain">
    <div class="pf-col">
      <div id="pfBanner"></div>
      <div id="pfStep"></div>
    </div>
  </main>

  <footer class="pf-footer">
    <span class="pf-footer__info" id="pfFooterInfo"></span>
    <div class="pf-footer__actions">
      <button class="nwt-button" nwt-variant="quiet" nwt-size="medium" type="button" id="pfPrev"><span class="nwt-button__content"><div class="nwt-icon nwt-button__icon"><i class="naotech-icon-arrow-left"></i></div>Anterior</span></button>
      <button class="nwt-button" nwt-variant="loud" nwt-size="medium" type="button" id="pfNext"><span class="nwt-button__content">Continuar<div class="nwt-icon nwt-button__icon"><i class="naotech-icon-arrow-right"></i></div></span></button>
    </div>
  </footer>

  <div class="pf-toast" id="pfToast" aria-live="polite"></div>
</div>

<script src="shared/programa-form.js?v=4"></script>
</body>
</html>
